services:
  postgres:
    image: postgres:16-alpine
    container_name: seen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seen
      POSTGRES_PASSWORD: seen_secret
      POSTGRES_DB: seen_jeem
    ports:
      - "5432:5432"
    volumes:
      - seen_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seen -d seen_jeem"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: seen-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - seen_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: seen-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/seen-media || true;
      mc anonymous set download local/seen-media;
      exit 0;
      "

volumes:
  seen_pg_data:
  seen_minio_data:
